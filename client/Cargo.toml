[package]
name = "macropad-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Configure a macropad over USB serial"
license = "MIT"
repository = "https://github.com/grunclepug/macropad"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui-wgpu = "0.37"
env_logger = "0.11.11"
log = "0.4.35"
png = "0.18.1"
pollster = "1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serialport = { version = "4.10", default-features = false }
toml = "1.2.1"
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
